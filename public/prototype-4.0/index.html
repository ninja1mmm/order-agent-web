<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Supply Chain Agent · Prototype 4.0</title>
  <link rel="stylesheet" href="assets/styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <main class="index-page">
    <div class="index-shell">
      <header class="index-header">
        <span class="prototype-tag">PROTOTYPE 4.0</span>
        <h1>邮件驱动的解析与订单合并</h1>
        <p>4.0 将用户工作对象从零散 Task 提升为完整邮件处理会话。三个页面组成一条可点击体验链路，不修改正式 Web 页面。</p>
      </header>

      <section class="index-grid">
        <article class="index-card">
          <div class="num">01</div>
          <h2>智能客服 · 邮件级待办</h2>
          <p>右侧按邮件聚合问题、附件进度与当前阶段，同一封邮件不再重复出现多个 Task。</p>
          <a class="btn primary" href="00-intelligent-service.html"><i data-lucide="layout-dashboard"></i>打开页面</a>
        </article>
        <article class="index-card">
          <div class="num">02</div>
          <h2>Task Workbench · 双视图</h2>
          <p>在邮件列表与客户时间线之间切换；客户视图保留邮件详情与附件解析入口。</p>
          <a class="btn primary" href="01-task-workbench.html"><i data-lucide="mail"></i>打开页面</a>
        </article>
        <article class="index-card">
          <div class="num">03</div>
          <h2>邮件解析确认 · 六阶段</h2>
          <p>确认解析范围、物料、日期与数量策略，查看 Merge 前局部 Orders 预览后再原子合并。</p>
          <a class="btn primary" href="02-mail-parse-review.html"><i data-lucide="workflow"></i>打开页面</a>
        </article>
      </section>
    </div>
  </main>
  <script src="assets/app.js"></script>
</body>
</html>
